[package]
name = "masks"
description = "graineo: vector masks and local adjustments on linear RGB"
edition.workspace = true
version.workspace = true
license.workspace = true
[dependencies]
# switch "Grafikkarte verwenden" (pools::gpu_allowed)
pools = { path = "../pools" }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = { version = "30", features = ["wgsl"] }
pollster = "0.4"
bytemuck = "1.25"
# content names of raster masks
sha2 = "0.11"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
