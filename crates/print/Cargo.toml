[package]
name = "print"
description = "Page layout, page raster and print files (PDF, JPEG, TIFF) for graineo"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# glyph outlines for captions and page numbers (IBM Plex Mono, rasterised into the page)
ab_glyph = "0.2"
# Flate streams of the PDF (image and ICC profile)
flate2 = "1"
jpeg-encoder = "0.6"

[dev-dependencies]
sha2 = "0.11"
