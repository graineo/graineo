[package]
name = "sensor_view"
description = "Sensor view for Bayer/X-Trans RAWs: analyses on the mosaic (histogram, clipping, mosaic, demosaic comparison, noise, sensor health, lens, sharpness, camera internals), without UI"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
raw = { path = "../raw" }
rayon = "1"
serde_json = "1"
# PNG for test output (graineo-dev sensor) and the embedded camera preview
image = { version = "0.25", default-features = false, features = ["png"] }
# Chart labels (IBM Plex Mono, SIL OFL 1.1, assets/)
ab_glyph = "0.2"
