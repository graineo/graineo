[package]
name = "rawdev"
description = "Developing non-Sigma RAWs (CR2/CR3/RAF/DNG/ARW) in graineo: preview, sliders, export, Lightroom starting values"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
# switch "Grafikkarte verwenden" (pools::gpu_allowed)
pools = { path = "../pools" }
graineo-color = { path = "../color" }
raw = { path = "../raw" }
lensprof = { path = "../lensprof" }
develop = { path = "../develop", default-features = false }
masks = { path = "../masks" }
# JPEG/HEIC/TIFF/PNG via macOS ImageIO (library::imageio)
library = { path = "../library" }
rayon = "1"
serde_json = "1"
legacy_names = { path = "../legacy_names" }
# full resolution on the GPU (noise reduction, sharpening, lens); falls back to the CPU without a GPU
wgpu = { version = "30", features = ["wgsl"] }
pollster = "0.4"
bytemuck = "1.25"

[dev-dependencies]
