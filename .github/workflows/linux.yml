# Experimental Linux build: builds graineo on GitHub-hosted runners, runs a headless start test
# (xvfb + software Vulkan) and provides the package as a workflow artifact. With `release_tag`,
# the packages are attached to that existing release.
name: Linux (experimental)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to attach the packages to (empty: only keep workflow artifacts)'
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'v*'

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_RELEASE_DEBUG: '0'
  CARGO_PROFILE_RELEASE_STRIP: 'true'
  # Source paths of the runner must not end up in panic messages
  RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=graineo --remap-path-prefix=/home/runner/.cargo=cargo

jobs:
  build:
    name: Build and test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 keeps the minimum glibc at 2.35
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake clang libclang-dev ca-certificates \
            libfontconfig1-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev libvulkan-dev libssl-dev \
            libdbus-1-dev libgtk-3-dev libasound2-dev libudev-dev libopenblas-dev \
            xvfb xauth mesa-vulkan-drivers libvulkan1 vulkan-tools file

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.arch }}-

      - name: Build
        run: cargo build --release --locked -p graineo -p graineo-dev

      - name: Tests (platform-neutral crates)
        run: cargo test --release --locked -p sysdirs -p faces

      - name: Start test (headless, software Vulkan)
        run: |
          set -euo pipefail
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)
          echo "Vulkan ICD: $icd"
          work="$RUNNER_TEMP/graineo-start-test"
          rm -rf "$work"
          mkdir -p "$work/data" "$work/home"
          export HOME="$work/home"
          export VK_ICD_FILENAMES="$icd"
          export WGPU_BACKEND=vulkan
          export GRAINEO_GPU=0
          export GRAINEO_DATA_DIR="$work/data"
          export GRAINEO_NO_PHOTOKIT=1
          export GRAINEO_LIBRARY_NO_SYNC=1
          export GRAINEO_LIBRARY_SIDECARS=0
          export GRAINEO_NO_XMP=1
          export GRAINEO_NO_SPLASH=1
          export GRAINEO_SCREENSHOT="$work/start.png@6"
          export GRAINEO_QUIT=9
          timeout 180 xvfb-run -a -s "-screen 0 1600x1000x24" target/release/graineo || {
            echo "::error::graineo exited with an error or timed out"
            exit 1
          }
          test -s "$work/start.png" || { echo "::error::screenshot missing or empty"; exit 1; }
          file "$work/start.png"
          cp "$work/start.png" "$RUNNER_TEMP/start-${{ matrix.arch }}.png"

      - name: Package
        run: |
          NATIVE=1 SKIP_BUILD=1 scripts/bundle-linux.sh
          ls -l dist
          cat dist/SHA256SUMS

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: graineo-linux-${{ matrix.arch }}-experimental
          path: |
            dist/*-experimental.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Upload start screenshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: start-screenshot-${{ matrix.arch }}
          path: ${{ runner.temp }}/start-${{ matrix.arch }}.png
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attach to release
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: graineo-linux-*-experimental
          path: packages
          merge-multiple: false

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            v[0-9]*) ;;
            *) echo "::error::unexpected release tag"; exit 1 ;;
          esac
          cd packages
          # One checksum file per architecture folder: merge into a single, uniquely named list
          cat */SHA256SUMS | sort -u > SHA256SUMS-linux-experimental
          files=$(find . -name '*-experimental.tar.gz' -type f)
          [ -n "$files" ] || { echo "::error::no packages found"; exit 1; }
          cp $files .
          # shellcheck disable=SC2086
          gh release upload "$RELEASE_TAG" --repo "$REPO" --clobber \
            $(for f in $files; do basename "$f"; done) SHA256SUMS-linux-experimental
